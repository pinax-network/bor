name: Firehose bor

# Builds bor with the Firehose tracer (enable it with --vmtrace=firehose) from this
# repository alone: no StreamingFast images or release assets are used.
#
# - pull requests into the `firehose` branch: run the Firehose tracer tests and build bor
# - a pushed tag like `v2.10.1-fh3.0`: the same, then publish the binary and its sha256
#   to a GitHub Release for that tag
#
# The binary is built the way bor's Makefile `bor` target builds it (PGO profile, GitCommit
# ldflag), on Ubuntu 22.04 so it runs on any newer glibc, including the Debian 13 hosts.

on:
  pull_request:
    branches:
      - firehose
  push:
    tags:
      - "v*-fh*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test the Firehose tracer
        run: |
          go test ./eth/tracers/ -run 'Firehose' -count=1
          go test ./eth/tracers/internal/tracetest/firehose/... -count=1

      - name: Build bor
        run: |
          make bor
          ./build/bin/bor version

      - name: Package
        id: package
        run: |
          name="bor-linux-amd64"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            name="bor-${GITHUB_REF#refs/tags/}-linux-amd64"
          fi
          mkdir -p dist
          cp build/bin/bor "dist/${name}"
          (cd dist && sha256sum "${name}" > "${name}.sha256")
          cat "dist/${name}.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          files: dist/*
